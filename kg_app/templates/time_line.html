    <style>

        /* ===================================== */
        /* MAIN TRACKING LAYOUT */
        /* ===================================== */

        .tracking-container {

            display: flex;

            gap: 20px;

            height: 82vh;

            width: 100%;
        }

        /* ===================================== */
        /* LEFT EMPLOYEE PANEL */
        /* ===================================== */

        .employee-panel {

            width: 30%;

            min-width: 320px;

            background: #ffffff;

            border-radius: 18px;

            overflow: hidden;

            position: relative;

            box-shadow:
                0 4px 20px rgba(0,0,0,0.08);

            display: flex;

            flex-direction: column;
        }

        /* ===================================== */
        /* PANEL HEADER */
        /* ===================================== */

        .panel-header {

            padding: 22px 20px;

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #5b4de0
                );

            color: white;
        }

        .panel-header h4 {

            margin: 0;

            font-size: 22px;

            font-weight: 600;

            letter-spacing: 0.5px;
        }

        /* ===================================== */
        /* SEARCH BOX */
        /* ===================================== */

        .new-search-box {

            padding: 15px !important;

            background: white !important;

            border-bottom: 1px solid #f1f1f1 !important;

            position: sticky !important;

            top: 0 !important;

            z-index: 10 !important;
        }

        .new-search-box input {

            width: 100% !important;

            height: 48px !important;

            border: 1px solid #e4e4e4 !important;

            border-radius: 12px !important;

            padding: 0 18px !important;

            font-size: 14px !important;

            outline: none !important;

            transition: 0.3s !important;

            background: #fafafa !important;
        }

        .new-search-box input:focus {

            border-color: #6c5ce7 !important;

            background: white !important;

            box-shadow:
                0 0 0 4px rgba(108,92,231,0.12) !important;
        }

        /* ===================================== */
        /* EMPLOYEE LIST */
        /* ===================================== */

        .employee-list {

            height: calc(82vh - 145px);

            overflow-y: auto;

            padding: 15px;
        }

        /* Custom Scrollbar */

        .employee-list::-webkit-scrollbar {

            width: 6px;
        }

        .employee-list::-webkit-scrollbar-thumb {

            background: #c7c7c7;

            border-radius: 20px;
        }

        /* ===================================== */
        /* EMPLOYEE CARD */
        /* ===================================== */

        .employee-card {

            display: flex;

            justify-content: space-between;

            align-items: center;

            padding: 16px;

            border-radius: 14px;

            background: #f8f9fc;

            margin-bottom: 14px;

            transition: 0.3s;

            cursor: pointer;

            border: 1px solid transparent;
        }

        .employee-card:hover {

            background: #eef2ff;

            transform: translateY(-2px);

            border-color: #d8d4ff;
        }

        /* Active employee */

        .employee-card.active {

            background: #ede9ff;

            border-color: #6c5ce7;
        }

        /* ===================================== */
        /* EMPLOYEE INFO */
        /* ===================================== */

        .employee-info {

            display: flex;

            align-items: center;

            gap: 14px;
        }

        /* ===================================== */
        /* AVATAR */
        /* ===================================== */

        .employee-avatar {

            width: 50px;

            height: 50px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #5b4de0
                );

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;

            font-weight: bold;

            flex-shrink: 0;
        }

        /* ===================================== */
        /* EMPLOYEE TEXT */
        /* ===================================== */

        .employee-card h5 {

            margin: 0;

            font-size: 16px;

            font-weight: 600;

            color: #2d3436;
        }

        .employee-card p {

            margin: 3px 0 0;

            font-size: 13px;

            color: #777;
        }

        /* ===================================== */
        /* VIEW BUTTON */
        /* ===================================== */

        .view-btn {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #6c5ce7,
                    #5b4de0
                );

            color: white;

            padding: 10px 18px;

            border-radius: 10px;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.3s;

            box-shadow:
                0 3px 10px rgba(108,92,231,0.25);
        }

        .view-btn:hover {

            transform: scale(1.05);

            box-shadow:
                0 5px 14px rgba(108,92,231,0.35);
        }

        /* ===================================== */
        /* RIGHT MAP SECTION */
        /* ===================================== */

        .map-section {

            width: 70%;

            background: white;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 4px 20px rgba(0,0,0,0.08);

            position: relative;
        }

        /* ===================================== */
        /* MAP */
        /* ===================================== */

        #map {

            width: 100%;

            height: 100%;
        }

        /* ===================================== */
        /* RESPONSIVE */
        /* ===================================== */

        @media(max-width: 992px) {

            .tracking-container {

                flex-direction: column;

                height: auto;
            }

            .employee-panel {

                width: 100%;

                height: 400px;
            }

            .map-section {

                width: 100%;

                height: 70vh;
            }

            .employee-list {

                height: calc(400px - 145px);
            }
        }

    </style>

    <script>

        // ============================
        // INITIALIZE MAP
        // ============================

        var map = L.map('map').setView(
            [20.2961, 85.8245],
            13
        );

        // ============================
        // TILE LAYER
        // ============================

        L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 20,
            }
        ).addTo(map);

        // ============================
        // STORE MAP ITEMS
        // ============================

        let markers = [];
        let polyline = null;

        // ============================
        // CUSTOM ICONS
        // ============================

        const startIcon = L.divIcon({
            html: `
                <div style="
                    background: #22c55e;
                    width: 18px;
                    height: 18px;
                    border-radius: 50%;
                    border: 4px solid white;
                    box-shadow: 0 0 10px rgba(0,0,0,0.4);
                "></div>
            `,
            className: '',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        const endIcon = L.divIcon({
            html: `
                <div style="
                    background: #ef4444;
                    width: 18px;
                    height: 18px;
                    border-radius: 50%;
                    border: 4px solid white;
                    box-shadow: 0 0 10px rgba(0,0,0,0.4);
                "></div>
            `,
            className: '',
            iconSize: [18, 18],
            iconAnchor: [9, 9]
        });

        // ============================
        // LOAD EMPLOYEE TIMELINE
        // ============================

        async function loadTimeline(employeeId) {

            // ========================
            // CLEAR OLD MARKERS
            // ========================

            markers.forEach(marker => {

                map.removeLayer(marker);

            });

            markers = [];

            // ========================
            // REMOVE OLD ROUTE
            // ========================

            if (polyline) {

                map.removeLayer(polyline);
            }

            // ========================
            // FETCH TIMELINE DATA
            // ========================

            let response = await fetch(
                `/employee-timeline/${employeeId}/`
            );

            let locations = await response.json();

            let latlngs = [];

            // ========================
            // PREPARE ROUTE POINTS
            // ========================

            locations.forEach(loc => {

                latlngs.push([
                    loc.latitude,
                    loc.longitude
                ]);

            });

            // ========================
            // DRAW ROUTE LINE
            // ========================

            polyline = L.polyline(
                latlngs,
                {
                    color: '#2563eb',
                    weight: 6,
                    opacity: 0.8,
                    smoothFactor: 1
                }
            ).addTo(map);

            // ========================
            // START MARKER
            // ========================

            if (locations.length > 0) {

                let start = locations[0];

                let startMarker = L.marker(
                    [start.latitude, start.longitude],
                    {
                        icon: startIcon
                    }
                )
                .addTo(map)
                .bindPopup(`
                    <b>Start Point</b><br>
                    Time: ${formatTime(start.time)}
                `);

                markers.push(startMarker);
            }

            // ========================
            // END MARKER
            // ========================

            if (locations.length > 1) {

                let end = locations[locations.length - 1];

                let endMarker = L.marker(
                    [end.latitude, end.longitude],
                    {
                        icon: endIcon
                    }
                )
                .addTo(map)
                .bindPopup(`
                    <b>End Point</b><br>
                    Time: ${formatTime(end.time)}
                `);

                markers.push(endMarker);
            }

            // ========================
            // AUTO FIT ROUTE
            // ========================

            map.fitBounds(
                polyline.getBounds(),
                {
                    padding: [50, 50]
                }
            );
        }

        function formatTime(time) {

            return new Date(time).toLocaleString('en-IN', {

                day: '2-digit',
                month: 'short',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true

            });
        }

    </script>

    <script>
        function searchEmployees() {
            let input = document.getElementById(
                'employeeSearch'
            );
            let filter = input.value.toLowerCase();
            let employees = document.querySelectorAll(
                '.employee-item'
            );
            employees.forEach(employee => {
                let name = employee.querySelector(
                    '.employee-name'
                ).innerText.toLowerCase();
                if (name.includes(filter)) {
                    employee.style.display = '';
                } else {
                    employee.style.display = 'none';
                }
            });
        }

    </script>

</body>

</html>
